// IP 地區由 functions/index.js 在 Cloudflare 寫進 <html data-geo>：台灣、香港、澳門、中國用中文，其他地區用英文。GitHub Pages 沒有這一步，直接看瀏覽器語言
window.MB_LANG = (function () {
  var q = null, s = null, h = document.documentElement;
  try { q = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  try { s = localStorage.getItem('morningbell.lang'); } catch (e) {}
  var g = h.getAttribute('data-geo'), geo = /^[A-Z]{2}$/.test(g || '') ? (/^(TW|HK|MO|CN)$/.test(g) ? 'zh' : 'en') : null;
  var l = q === 'en' || q === 'zh' ? q : s === 'en' || s === 'zh' ? s : geo || ([].concat(navigator.languages || navigator.language || []).some(function (x) { return /^zh/i.test(x); }) ? 'zh' : 'en');
  if (l === 'en') { h.lang = 'en'; document.title = 'Morningbell · US & Taiwan market daily'; }
  h.setAttribute('data-lang', l); return l;
})();
