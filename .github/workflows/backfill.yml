name: Backfill history

# 手動執行：補長歷史（S&P 500 從 1927 年起，需要 Yahoo；本機常被擋，在 Actions 上跑）或新增觀察清單代號後回補
on:
  workflow_dispatch:
    inputs:
      only:
        description: "只補這些（空白分隔），例如 SPX_LONG 或 2330 AAPL"
        default: "SPX_LONG"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 pipeline/backfill.py --only ${{ github.event.inputs.only }}
      - run: python3 pipeline/build.py
      - run: |
          git config user.name "morningbell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: backfill ${{ github.event.inputs.only }}" && git pull --rebase origin main && git push)
